global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # portfolio is a separate Compose project, reached via a host-published port rather than a
  # shared Docker network - see the docker-compose.yml tempo service comment. Job name is
  # app-scoped rather than generic ("backend") since this stack is shared across projects.
  - job_name: portfolio-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18085"]
