# Local Development Override
# Docker Compose automatically loads this file if you just run `docker compose up`!
# It injects the build instructions and local environment variables.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      # Drives resumeFilesDir() in filebrowser.go - keeps local test uploads
      # in /resumes/dev, separate from real production attachments in
      # /resumes/prod (same Filebrowser instance/FILEBROWSER_PUBLIC_URL as
      # prod, so without this split they'd land in the same folder).
      - APP_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8085
    ports:
      - "8086:3000"
    env_file:
      - ./frontend/.env

  redis:
    ports:
      - "6379:6379"
