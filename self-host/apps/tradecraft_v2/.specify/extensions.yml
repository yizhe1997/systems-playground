installed:
- screens
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: screens
    command: speckit.screens.draft
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.screens.draft?
    description: Draft rough screens from the new spec (constitution principle V)
    condition: null
  before_plan:
  - extension: screens
    command: speckit.screens.signoff
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.screens.signoff?
    description: Screens must be signed off before technical design (constitution
      principle V)
    condition: null
