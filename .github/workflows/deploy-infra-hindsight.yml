name: Deploy Infra - Hindsight
on:
  push:
    branches:
      - main
    paths:
      - 'self-host/infra/hindsight/**'
      - '.github/workflows/deploy-infra-hindsight.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      INFRA_BASE_DIR: ${{ vars.INFRA_BASE_DIR }}
      HOST: ${{ vars.HOST }}
      HINDSIGHT_SUBDOMAIN: ${{ vars.HINDSIGHT_SUBDOMAIN }}
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Infisical CLI
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy hindsight
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- bash -c '
          set -e
          : "${INFRA_BASE_DIR:?INFRA_BASE_DIR repository variable must be set}"
          : "${HOST:?HOST repository variable must be set (your domain, e.g. example.com)}"
          : "${HINDSIGHT_POSTGRES_PASSWORD:?HINDSIGHT_POSTGRES_PASSWORD must be set in Infisical}"
          : "${HINDSIGHT_TENANT_API_KEY:?HINDSIGHT_TENANT_API_KEY must be set in Infisical}"
          : "${HINDSIGHT_LLM_API_KEY:?HINDSIGHT_LLM_API_KEY must be set in Infisical}"
          TARGET="$INFRA_BASE_DIR/hindsight"
          mkdir -p "$TARGET"

          echo "📦 Syncing hindsight compose..."
          cp -v self-host/infra/hindsight/docker-compose.yml "$TARGET/"

          # HOST is not a secret. Persisting it beside the compose file lets a bare docker compose
          # up -d at boot (wsl-startup.sh has no GitHub variables) render the same tunnel label
          # instead of failing. The three secrets are NOT persisted: at boot that bare up fails
          # closed on their :? guards and the existing container is restored by its restart policy.
          ENV_FILE="$TARGET/.env"
          touch "$ENV_FILE"
          grep -v -E "^(HOST|HINDSIGHT_SUBDOMAIN)=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
          printf "HOST=%s\n" "$HOST" >> "$ENV_FILE.tmp"
          if [ -n "${HINDSIGHT_SUBDOMAIN:-}" ]; then printf "HINDSIGHT_SUBDOMAIN=%s\n" "$HINDSIGHT_SUBDOMAIN" >> "$ENV_FILE.tmp"; fi
          cat "$ENV_FILE.tmp" > "$ENV_FILE"
          rm -f "$ENV_FILE.tmp"

          cd "$TARGET" || { echo "❌ Directory $TARGET not found!"; exit 1; }
          echo "📥 Pulling hindsight images..."
          docker compose pull
          echo "🔄 Restarting hindsight..."
          docker compose up -d
          echo "✅ hindsight deployed."
          '

      - name: Prune old images
        run: docker image prune -f
