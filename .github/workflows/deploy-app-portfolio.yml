name: Deploy App - Portfolio
on:
  push:
    branches:
      - main
    paths:
      # Deliberately NOT the whole self-host/apps/portfolio/** tree. backend/** and frontend/**
      # are each watched by their own build-and-push workflow already, so real code changes there
      # reach this workflow via workflow_run below, strictly after the build finishes — watching
      # those paths here too would race the build (this push trigger firing immediately and
      # pulling whatever image is still in the registry, the OLD one, instead of waiting). The
      # compose files below aren't covered by any build workflow though, so they still need a
      # direct trigger, same for this workflow's own file.
      - 'self-host/apps/portfolio/docker-compose.yml'
      - 'self-host/apps/portfolio/docker-compose.prod.yml'
      - '.github/workflows/deploy-app-portfolio.yml'
  workflow_run:
    workflows: ["Build and Push Backend", "Build and Push Frontend"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  # Backend and frontend builds finish independently, so a single push
  # touching both fires this workflow twice - without this, both runs land
  # on the same host at once and race each other's `docker compose up -d`
  # to stop/recreate/rebind the same container ports (the actual cause of
  # the repeated "address already in use" failures, not a stray process on
  # the host). cancel-in-progress stays false: a deploy mid-flight should
  # finish, not be killed and leave containers half-swapped: the second run
  # queues and runs after, which is a no-op anyway since it'll pull the
  # same image the first run already deployed.
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    # Skip if this run was triggered by a failed/cancelled build — no point redeploying the old
    # image. push/workflow_dispatch runs have no workflow_run conclusion to check, so always proceed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      APP_BASE_DIR: ${{ vars.APP_BASE_DIR }}
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Infisical CLI
        # No sudo/apt: self-hosted runner's service account very likely doesn't have passwordless
        # sudo configured, which fails immediately in a non-interactive CI context (no TTY to
        # prompt). Downloading the release binary straight to a user-writable dir sidesteps that
        # entirely instead of requiring a sudoers change on the host.
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger Instant Zero-Downtime Deployment
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          # infisical run injects every secret in this project/env as a real environment
          # variable into the wrapped script below — nothing above this point ever held the
          # actual secret values, only the Infisical credential used to fetch them.
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- bash -c '
          set -e
          : "${APP_BASE_DIR:?APP_BASE_DIR repository variable must be set}"
          APP_DIR="$APP_BASE_DIR/portfolio"
          mkdir -p "$APP_DIR"

          echo "📦 Copying latest compose configurations to $APP_DIR..."
          cp -v self-host/apps/portfolio/docker-compose.yml "$APP_DIR/"
          cp -v self-host/apps/portfolio/docker-compose.prod.yml "$APP_DIR/docker-compose.override.yml"

          # No .env files written anymore. docker-compose.yml/docker-compose.prod.yml use
          # dollar-brace interpolation (environment blocks) instead of env_file, so docker
          # compose below reads every secret directly from its own process environment,
          # the same one infisical run injected into. See docs/adrs/002-infisical-secret-injection.md.

          cd "$APP_DIR" || { echo "❌ Directory $APP_DIR not found!"; exit 1; }
          echo "📁 Contents of $APP_DIR after copy:"
          ls -la "$APP_DIR"

          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME must be set in Infisical}"
          : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD must be set in Infisical}"
          # No hard requirement on REGISTRY_HOST: this deploy runs on the same self-hosted
          # runner/host as the registry container itself (port 5000, see
          # self-host/infra/registry/docker-compose.yml), so localhost:5000 is always correct
          # here regardless of whatever public hostname REGISTRY_HOST may hold for external use.
          export REGISTRY_HOST="${REGISTRY_HOST:-localhost:5000}"
          echo "🔐 Logging in to self-hosted registry..."
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

          echo "📥 Pulling latest pre-built images from registry..."
          docker compose pull

          # A container that failed its port bind on a previous deploy is left behind in
          # "created" state (never started) rather than cleaned up - `docker compose up -d`
          # then just retries starting that same broken container forever, hitting the exact
          # same port conflict on every future deploy even after whatever caused the original
          # failure is long gone. Force-removing anything stuck in "created" for this project
          # before recreating guarantees a genuinely fresh container instead.
          echo "🧹 Removing any containers stuck in created (never started) state..."
          docker compose ps -a --status created -q | xargs -r docker rm -f

          echo "🔄 Gracefully recreating containers..."
          # Recreating a container with a static host port publish requires the old one to
          # fully release that port before the new one can bind it - on a host this busy
          # (lots of accumulated iptables/network state across many long-running containers),
          # that release sometimes lands a beat after Compose already tries the new bind,
          # failing with "address already in use" even though nothing else actually wants the
          # port. This is a known Docker/Moby race during recreate, not something fixable from
          # the compose file - a short retry is the standard mitigation, since the port is
          # reliably free by the second attempt.
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "❌ docker compose up -d failed after 3 attempts"
              exit 1
            fi
            echo "⚠️ docker compose up -d failed (attempt $attempt/3) - likely a port-release race, retrying in 5s..."
            sleep 5
          done

          echo "🧹 Cleaning up old images..."
          docker image prune -f

          echo "✅ Instant deployment complete!"
          '