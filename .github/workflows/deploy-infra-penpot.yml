name: Deploy Infra - Penpot
on:
  push:
    branches:
      - main
    paths:
      - 'self-host/infra/penpot/**'
      - '.github/workflows/deploy-infra-penpot.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      INFRA_BASE_DIR: ${{ vars.INFRA_BASE_DIR }}
      HOST: ${{ vars.HOST }}
      PENPOT_SUBDOMAIN: ${{ vars.PENPOT_SUBDOMAIN }}
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Infisical CLI
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Penpot
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- bash -c '
          set -e
          : "${INFRA_BASE_DIR:?INFRA_BASE_DIR repository variable must be set}"
          : "${HOST:?HOST repository variable must be set (your domain, e.g. example.com)}"
          : "${PENPOT_SECRET_KEY:?PENPOT_SECRET_KEY must be set in Infisical}"
          : "${PENPOT_POSTGRES_PASSWORD:?PENPOT_POSTGRES_PASSWORD must be set in Infisical}"
          TARGET="$INFRA_BASE_DIR/penpot"
          mkdir -p "$TARGET"

          echo "📦 Syncing penpot compose..."
          cp self-host/infra/penpot/docker-compose.yml "$TARGET/"

          # HOST/PENPOT_SUBDOMAIN/PENPOT_PUBLIC_URI are not secrets. Persisting them beside the
          # compose file lets a bare docker compose up -d at boot (wsl-startup.sh has no GitHub
          # variables, let alone Infisical access) render the same tunnel label and public URI
          # instead of failing or reverting to the localhost default. PENPOT_SECRET_KEY and
          # PENPOT_POSTGRES_PASSWORD are NOT written here — they stay only in this steps shell
          # environment (from infisical run above); on reboot, the already-running container keeps
          # its secrets from the last CI deploy, same as every other service on this host.
          PENPOT_SUBDOMAIN="${PENPOT_SUBDOMAIN:-penpot}"
          PUBLIC_URI="https://${PENPOT_SUBDOMAIN}.${HOST}"
          ENV_FILE="$TARGET/.env"
          touch "$ENV_FILE"
          grep -v -E "^(HOST|PENPOT_SUBDOMAIN|PENPOT_PUBLIC_URI)=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
          {
            printf "HOST=%s\n" "$HOST"
            printf "PENPOT_SUBDOMAIN=%s\n" "$PENPOT_SUBDOMAIN"
            printf "PENPOT_PUBLIC_URI=%s\n" "$PUBLIC_URI"
          } >> "$ENV_FILE.tmp"
          cat "$ENV_FILE.tmp" > "$ENV_FILE"
          rm -f "$ENV_FILE.tmp"

          cd "$TARGET" || { echo "❌ Directory $TARGET not found!"; exit 1; }
          echo "🔄 Restarting penpot..."
          docker compose pull
          docker compose up -d
          echo "✅ penpot deployed at $PUBLIC_URI"
          '

      - name: Prune old images
        run: docker image prune -f
