name: Deploy Infra - n8n
on:
  push:
    branches:
      - main
    paths:
      # Deliberately NOT self-host/infra/n8n/** — build-infra-n8n.yml already watches that whole
      # directory, so any real change gets caught there and reaches this workflow via workflow_run
      # below, strictly after the build finishes. Watching the same paths here too would race the
      # build: this push trigger would fire immediately and pull whatever image is still in the
      # registry (the OLD one), rather than waiting. Only this workflow's own file needs a direct
      # trigger, since editing it isn't something build-infra-n8n.yml would ever pick up.
      - '.github/workflows/deploy-infra-n8n.yml'
  workflow_run:
    workflows: ["Build and Push n8n"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    # Skip if this run was triggered by a failed/cancelled build — no point redeploying the old
    # image. push/workflow_dispatch runs have no workflow_run conclusion to check, so always proceed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      INFRA_BASE_DIR: ${{ vars.INFRA_BASE_DIR }}
      HOST: ${{ vars.HOST }}
      N8N_SUBDOMAIN: ${{ vars.N8N_SUBDOMAIN }}
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Infisical CLI
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy n8n
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- bash -c '
          set -e
          : "${INFRA_BASE_DIR:?INFRA_BASE_DIR repository variable must be set}"
          : "${HOST:?HOST repository variable must be set (your domain, e.g. example.com)}"
          : "${N8N_POSTGRES_PASSWORD:?N8N_POSTGRES_PASSWORD must be set in Infisical}"
          : "${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD must be set in Infisical}"
          export N8N_POSTGRES_USER="${N8N_POSTGRES_USER:-n8n}"
          export N8N_BASIC_AUTH_USER="${N8N_BASIC_AUTH_USER:-admin}"
          export N8N_HOST="${N8N_HOST:-http://localhost:5678}"
          TARGET="$INFRA_BASE_DIR/n8n"
          mkdir -p "$TARGET"

          echo "📦 Syncing n8n compose..."
          cp -v self-host/infra/n8n/docker-compose.yml "$TARGET/"

          # HOST is not a secret. Persisting it beside the compose file lets a bare docker compose up -d at
          # boot (wsl-startup.sh has no GitHub variables) render the same tunnel label instead of failing.
          ENV_FILE="$TARGET/.env"
          touch "$ENV_FILE"
          grep -v -E "^(HOST|N8N_SUBDOMAIN)=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
          printf "HOST=%s\n" "$HOST" >> "$ENV_FILE.tmp"
          if [ -n "${N8N_SUBDOMAIN:-}" ]; then printf "N8N_SUBDOMAIN=%s\n" "$N8N_SUBDOMAIN" >> "$ENV_FILE.tmp"; fi
          cat "$ENV_FILE.tmp" > "$ENV_FILE"
          rm -f "$ENV_FILE.tmp"

          cd "$TARGET" || { echo "❌ Directory $TARGET not found!"; exit 1; }

          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME must be set in Infisical}"
          : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD must be set in Infisical}"
          # No hard requirement on REGISTRY_HOST: this deploy runs on the same self-hosted
          # runner/host as the registry container itself (port 5000, see
          # self-host/infra/registry/docker-compose.yml), so localhost:5000 is always correct
          # here regardless of whatever public hostname REGISTRY_HOST may hold for external use.
          export REGISTRY_HOST="${REGISTRY_HOST:-localhost:5000}"
          echo "🔐 Logging in to self-hosted registry..."
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

          echo "📥 Pulling latest n8n image from registry..."
          docker compose pull
          echo "🔄 Restarting n8n..."
          docker compose up -d
          echo "✅ n8n deployed."
          '

      - name: Prune old images
        run: docker image prune -f
