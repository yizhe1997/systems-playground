name: Build and Push Tradecraft

# Runs only after "Test Tradecraft" has passed on a push to main, so an image that failed its tests is never built, let
# alone deployed. Both images are built here, one after the other, so the deploy that follows (deploy-app-tradecraft.yml
# listens for this workflow) always finds a matching pair in the registry.
on:
  workflow_run:
    workflows: ["Test Tradecraft"]
    types:
      - completed
  workflow_dispatch: # a manual build, for when the tests ran earlier

# nothing here writes to the repository: the default token is read-only
permissions:
  contents: read

jobs:
  build-and-push:
    # push events on main only: a workflow_run of a pull request must never reach the self-hosted runner
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: self-hosted
    env:
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out the commit that was tested
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Infisical CLI
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to self-hosted registry
        id: registry-auth
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- \
            sh -c 'REGISTRY_HOST="${REGISTRY_HOST:-localhost:5000}"; echo "::add-mask::$REGISTRY_PASSWORD" && echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin && echo "host=$REGISTRY_HOST" >> "$GITHUB_OUTPUT"'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          # network=host so localhost:5000 inside the builder is the host's registry (see build-app-portfolio-frontend.yml)
          driver-opts: network=host

      - name: Build and push the API image
        uses: docker/build-push-action@v4
        with:
          context: ./self-host/apps/tradecraft/backend
          file: ./self-host/apps/tradecraft/backend/Dockerfile
          push: true
          tags: ${{ steps.registry-auth.outputs.host }}/tradecraft-backend:latest

      - name: Build and push the web image
        # No build arguments: the web tier reads every address at run time, so one image runs anywhere.
        uses: docker/build-push-action@v4
        with:
          context: ./self-host/apps/tradecraft/frontend
          file: ./self-host/apps/tradecraft/frontend/Dockerfile
          push: true
          tags: ${{ steps.registry-auth.outputs.host }}/tradecraft-frontend:latest
