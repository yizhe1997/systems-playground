name: Deploy Infra - Filebrowser
on:
  push:
    branches:
      - main
    paths:
      - 'self-host/infra/filebrowser/**'
      - '.github/workflows/deploy-infra-filebrowser.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      INFRA_BASE_DIR: ${{ vars.INFRA_BASE_DIR }}
      HOST: ${{ vars.HOST }}
      FILES_SUBDOMAIN: ${{ vars.FILES_SUBDOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Deploy filebrowser
        run: |
          : "${INFRA_BASE_DIR:?INFRA_BASE_DIR repository variable must be set}"
          : "${HOST:?HOST repository variable must be set (your domain, e.g. example.com)}"
          TARGET="$INFRA_BASE_DIR/filebrowser"
          mkdir -p "$TARGET"

          echo "📦 Syncing filebrowser compose..."
          cp self-host/infra/filebrowser/docker-compose.yml "$TARGET/"

          # HOST is not a secret. Persisting it beside the compose file lets a bare docker compose up -d at
          # boot (wsl-startup.sh has no GitHub variables) render the same tunnel label instead of failing.
          ENV_FILE="$TARGET/.env"
          touch "$ENV_FILE"
          grep -v -E "^(HOST|FILES_SUBDOMAIN)=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
          printf 'HOST=%s\n' "$HOST" >> "$ENV_FILE.tmp"
          if [ -n "${FILES_SUBDOMAIN:-}" ]; then printf 'FILES_SUBDOMAIN=%s\n' "$FILES_SUBDOMAIN" >> "$ENV_FILE.tmp"; fi
          cat "$ENV_FILE.tmp" > "$ENV_FILE"
          rm -f "$ENV_FILE.tmp"

          echo "🔄 Restarting filebrowser..."
          cd "$TARGET"
          docker compose pull
          docker compose up -d
          echo "✅ filebrowser deployed."

      - name: Prune old images
        run: docker image prune -f
