name: Deploy Infra - dsh
on:
  push:
    branches:
      - main
    paths:
      # Deliberately NOT self-host/infra/dsh/** - build-infra-dsh.yml already watches that whole directory and
      # reaches this workflow via workflow_run below, strictly after the images exist. See deploy-infra-n8n.yml.
      - '.github/workflows/deploy-infra-dsh.yml'
  workflow_run:
    workflows: ["Build and Push dsh"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    # Skip if this run was triggered by a failed/cancelled build - no point redeploying the old images.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      INFRA_BASE_DIR: ${{ vars.INFRA_BASE_DIR }}
      # Optional. While HOST is unset the stack is reachable only on the host loopback; setting it publishes
      # <DSH_SUBDOMAIN or dsh>.<HOST> through the Cloudflare Tunnel, so create its Cloudflare Access policy
      # first (see self-host/infra/dsh/README.md).
      HOST: ${{ vars.HOST }}
      DSH_SUBDOMAIN: ${{ vars.DSH_SUBDOMAIN }}
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Infisical CLI
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy dsh
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- bash -c '
          set -e
          : "${INFRA_BASE_DIR:?INFRA_BASE_DIR repository variable must be set}"
          if [ -z "${OPENROUTER_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "❌ Set OPENROUTER_API_KEY and/or ANTHROPIC_API_KEY in Infisical (prod): dsh has no model to call without one."
            exit 1
          fi
          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME must be set in Infisical}"
          : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD must be set in Infisical}"
          export REGISTRY_HOST="${REGISTRY_HOST:-localhost:5000}"

          TARGET="$INFRA_BASE_DIR/dsh"
          mkdir -p "$TARGET/workspaces"

          echo "📦 Syncing dsh compose..."
          # Deliberately compose.yml, not docker-compose.yml. wsl-startup.sh runs a plain docker compose up -d for every
          # */docker-compose.yml with no Infisical in the environment, which would recreate the gateway with blank API
          # keys after a reboot. Under this name the boot script skips the service, and restart: unless-stopped brings
          # the existing containers back with the environment baked in by this deploy (the end state ADR 002 describes).
          cp -v self-host/infra/dsh/docker-compose.yml "$TARGET/compose.yml"
          cp -v self-host/infra/dsh/link.sh "$TARGET/link.sh"

          # Persist the (non-secret) hostname settings so a manual docker compose up -d in this directory renders the
          # same tunnel label instead of an empty one, which would silently drop the public route.
          ENV_FILE="$TARGET/.env"
          touch "$ENV_FILE"
          grep -v -E "^(HOST|DSH_SUBDOMAIN)=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
          if [ -n "${HOST:-}" ]; then printf "HOST=%s\n" "$HOST" >> "$ENV_FILE.tmp"; fi
          if [ -n "${DSH_SUBDOMAIN:-}" ]; then printf "DSH_SUBDOMAIN=%s\n" "$DSH_SUBDOMAIN" >> "$ENV_FILE.tmp"; fi
          cat "$ENV_FILE.tmp" > "$ENV_FILE"
          rm -f "$ENV_FILE.tmp"

          cd "$TARGET" || { echo "❌ Directory $TARGET not found!"; exit 1; }

          echo "🔐 Logging in to self-hosted registry..."
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

          echo "📥 Pulling latest dsh images from registry..."
          docker compose pull
          echo "🔄 Restarting dsh..."
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
          if [ -n "${HOST:-}" ]; then
            echo "🌐 Published at https://${DSH_SUBDOMAIN:-dsh}.$HOST - it must already be behind a Cloudflare Access policy."
          else
            echo "🔒 Loopback only (HOST is not set)."
          fi
          echo "✅ dsh deployed. Launch link: cd $TARGET && sh link.sh"
          '

      - name: Prune old images
        run: docker image prune -f
