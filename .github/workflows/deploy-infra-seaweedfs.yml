name: Deploy Infra - SeaweedFS
on:
  push:
    branches:
      - main
    paths:
      - 'self-host/infra/seaweedfs/**'
      - '.github/workflows/deploy-infra-seaweedfs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      INFRA_BASE_DIR: ${{ vars.INFRA_BASE_DIR }}
      HOST: ${{ vars.HOST }}
      S3_SUBDOMAIN: ${{ vars.S3_SUBDOMAIN }}
      SEAWEEDFS_BUCKETS: ${{ vars.SEAWEEDFS_BUCKETS }}
      S3_ADMIN_SUBDOMAIN: ${{ vars.S3_ADMIN_SUBDOMAIN }}
      INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_SITE_URL || 'http://localhost:8090' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Infisical CLI
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/Infisical/cli/releases/latest | sed 's#.*/tag/##')
          VERSION="${LATEST_TAG#v}"
          curl -sL "https://github.com/Infisical/cli/releases/download/${LATEST_TAG}/cli_${VERSION}_linux_amd64.tar.gz" -o infisical-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf infisical-cli.tar.gz -C "$HOME/.local/bin" infisical
          chmod +x "$HOME/.local/bin/infisical"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm infisical-cli.tar.gz

      - name: Authenticate to Infisical
        id: infisical-auth
        run: |
          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID repository variable must be set}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET repository secret must be set}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID repository variable must be set}"
          TOKEN=$(infisical login --domain="$INFISICAL_DOMAIN" --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy seaweedfs
        env:
          INFISICAL_TOKEN: ${{ steps.infisical-auth.outputs.token }}
        run: |
          infisical run --domain="$INFISICAL_DOMAIN" --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod -- bash -c '
          set -e
          : "${INFRA_BASE_DIR:?INFRA_BASE_DIR repository variable must be set}"
          : "${HOST:?HOST repository variable must be set (your domain, e.g. example.com)}"
          : "${SEAWEEDFS_S3_ACCESS_KEY:?SEAWEEDFS_S3_ACCESS_KEY must be set in Infisical}"
          : "${SEAWEEDFS_S3_SECRET_KEY:?SEAWEEDFS_S3_SECRET_KEY must be set in Infisical}"
          : "${SEAWEEDFS_ADMIN_PASSWORD:?SEAWEEDFS_ADMIN_PASSWORD must be set in Infisical}"
          TARGET="$INFRA_BASE_DIR/seaweedfs"
          mkdir -p "$TARGET"

          echo "📦 Syncing seaweedfs compose..."
          cp -v self-host/infra/seaweedfs/docker-compose.yml "$TARGET/"

          # HOST, subdomain and bucket list are not secrets. Persisting them beside the compose file
          # lets a bare docker compose up -d at boot render the same tunnel label instead of failing.
          # The S3 keys and admin password are NOT persisted: at boot that bare up fails closed on their :? guards and
          # the existing container is restored by its restart policy.
          ENV_FILE="$TARGET/.env"
          touch "$ENV_FILE"
          grep -v -E "^(HOST|S3_SUBDOMAIN|SEAWEEDFS_BUCKETS|S3_ADMIN_SUBDOMAIN)=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
          printf "HOST=%s\n" "$HOST" >> "$ENV_FILE.tmp"
          if [ -n "${S3_SUBDOMAIN:-}" ]; then printf "S3_SUBDOMAIN=%s\n" "$S3_SUBDOMAIN" >> "$ENV_FILE.tmp"; fi
          if [ -n "${SEAWEEDFS_BUCKETS:-}" ]; then printf "SEAWEEDFS_BUCKETS=%s\n" "$SEAWEEDFS_BUCKETS" >> "$ENV_FILE.tmp"; fi
          if [ -n "${S3_ADMIN_SUBDOMAIN:-}" ]; then printf "S3_ADMIN_SUBDOMAIN=%s\n" "$S3_ADMIN_SUBDOMAIN" >> "$ENV_FILE.tmp"; fi
          cat "$ENV_FILE.tmp" > "$ENV_FILE"
          rm -f "$ENV_FILE.tmp"

          cd "$TARGET" || { echo "❌ Directory $TARGET not found!"; exit 1; }
          echo "📥 Pulling seaweedfs image..."
          docker compose pull
          echo "🔄 Restarting seaweedfs..."
          docker compose up -d
          echo "✅ seaweedfs deployed."
          '

      - name: Prune old images
        run: docker image prune -f
